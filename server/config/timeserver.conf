# /etc/chrony/conf.d/timeserver.conf  (Raspberry Pi OS Bookworm: chrony.conf が conf.d を読み込む)
# 上位: NICT 公開NTP。NICT のポリシーに合わせ問い合わせ間隔は64秒以上。
pool ntp.nict.jp iburst minpoll 6 maxpoll 10 maxsources 4

# 起動直後など、ずれが大きい場合は最初の3回だけ即時ステップ補正
makestep 1.0 3

# 宅内LANへNTPサーバとしても提供する(不要なら削除)
allow 192.168.0.0/16
allow 10.0.0.0/8
allow 172.16.0.0/12

# 外部同期が切れても、ローカル時計で stratum 10 として応答し続ける
local stratum 10

# RTC(DS3231)使用時: Raspberry Pi OS の既定 chrony.conf にある `rtcsync` で、同期後に RTC へ時刻が書き戻される。

# うるう秒: カーネルが UTC 0時(JST 9時)に時計を1秒戻す/進める(leapsecmode system = 既定)。jjyd はこれに合わせて
# 61秒/59秒のフレームを送る。chrony がうるう秒を知るには、既定の chrony.conf の `leapsectz right/UTC` を有効のままにするか、
# 代わりに `leapseclist /usr/share/zoneinfo/leap-seconds.list` を使う(どちらか一方)。smoothtime / leapsecmode slew は使わない。
