# /etc/jjyd.toml
[carrier]
khz = 60          # 60 = 西日本(はがね山) / 40 = 東日本(おおたかどや山)。変更後は jjyd を再起動
# 40/60kHz の切替はこの khz だけで行う。
# 共振オプション(外付けアンテナ用の K1・C7〜C9 を実装した場合のみ)は、下の行を有効にする(GPIO21 = J1 の 40 番ピン):
# select_gpio = 21
pwm_chip = 0
pwm_channel = 0   # dtoverlay=pwm,pin=18,func=2 の場合 GPIO18 = PWM0

[level]
gpio = 23         # 74LVC125 OE。Lowで最大振幅

[timesync]
check_interval_s = 30
holdover_s = 21600   # 同期が途切れても送信を続ける最大時間(6時間)。超えたらキャリア停止

# 基板上の DS3231 RTC(U2)+ CR2032(BT1)を使う。RTC が無い/読めない場合は自動で無視される。
# 有効時、再起動直後に NTP 同期できなくても、前回同期から holdover_s 秒以内なら送信を許可する。
[rtc]
enabled = true
holdover_s = 86400      # DS3231 は約±2ppm: 1日で0.2秒程度のずれ
state_file = "/var/lib/jjyd/last_sync"

# 送信信号 LED(基板の D2 / GPIO24)。低レベル期間だけ点灯: ビット1=0.5秒、ビット0=0.2秒、マーカー=0.8秒。
# 基板に無ければ [signal] ごと削除。
[signal]
gpio = 24

# 現在時刻を表示する 16x2 文字 LCD(I2C、ST7032 系 AQM1602 など。基板の J3)。
# 表示が薄い/濃いときは contrast(0〜63)を調整。LCD が無ければ enabled = false。
[lcd]
enabled = true
bus = 1
address = 0x3E
contrast = 32

# うるう秒(JJY の LS1/LS2 予告と、実施月1日 8:59 JST の 61 秒/59 秒フレーム)。
# 予定は tzdata の leap-seconds.list から読む(無ければうるう秒なしとして送る)。
# 壁時計がうるう秒で1秒戻る/進む必要があるので、chrony は既定の leapsecmode system のままにする
# (スムージング(smoothtime/leapsecmode slew)を使うとうるう秒の位置が合わない)。
[leap]
enabled = true
file = "/usr/share/zoneinfo/leap-seconds.list"

# 毎時15・45分に呼出符号 "JJY"(モールス)と停波予告 ST を入れる NICT 準拠のフレームにする。既定は false。
# "JJY" は NICT の局の呼出符号であり登録商標(T4355749)でもあるため、用途を理解したうえでのみ true にする。
# false のときは15・45分も通常フレーム(年・曜日・うるう秒入り)を送る。電波時計の受信には false で十分。
[callsign]
enabled = false
